<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나는 어떤 예술 철학자일까?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1A1D24; --muted:#5D6472; --line:#DDE1E7; --soft:#ECEEF2;
  --c-plato:#2F55B4; --s-plato:#DFE7FA;
  --c-tolstoy:#C2416A; --s-tolstoy:#F9DFE7;
  --c-confucius:#23805A; --s-confucius:#D9F0E5;
  --c-xunzi:#B0721A; --s-xunzi:#F7E8CD;
  --c-wilde:#7B3DB3; --s-wilde:#ECDFF8;
  --c-spingarn:#177A8D; --s-spingarn:#D4EEF3;
  --cheek:#FF8FA3; --face:#1A1D24; --white:#FFFFFF;
  --display:"Do Hyeon","Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121419; --surface:#1C1F27; --ink:#ECEEF3; --muted:#9EA5B3; --line:#2F3440; --soft:#262A34;
    --c-plato:#7D9BEA; --s-plato:#1E2A47;
    --c-tolstoy:#F07FA2; --s-tolstoy:#3E1F2B;
    --c-confucius:#6FCBA2; --s-confucius:#183829;
    --c-xunzi:#E4AA55; --s-xunzi:#3A2C14;
    --c-wilde:#BD92EC; --s-wilde:#30213F;
    --c-spingarn:#69C4D6; --s-spingarn:#14343B;
    --face:#1A1D24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121419; --surface:#1C1F27; --ink:#ECEEF3; --muted:#9EA5B3; --line:#2F3440; --soft:#262A34;
  --c-plato:#7D9BEA; --s-plato:#1E2A47; --c-tolstoy:#F07FA2; --s-tolstoy:#3E1F2B;
  --c-confucius:#6FCBA2; --s-confucius:#183829; --c-xunzi:#E4AA55; --s-xunzi:#3A2C14;
  --c-wilde:#BD92EC; --s-wilde:#30213F; --c-spingarn:#69C4D6; --s-spingarn:#14343B;
  --face:#1A1D24; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--c-plato);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;padding:18px 18px 56px}
h1,h2,h3{margin:0;font-weight:400}
p{margin:0}
.muted{color:var(--muted)}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:16px 18px;background:var(--ink);color:var(--bg);font-weight:600;font-size:17px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.linkish{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px;padding:8px 0}

/* intro */
.intro{min-height:88vh;display:flex;flex-direction:column}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin:18px -6px 6px}
.cast svg{width:100%;height:auto;display:block}
.intro h1{font-family:var(--display);font-size:40px;line-height:1.15;letter-spacing:-.5px;margin-top:10px;word-break:keep-all}
.intro .sub{margin:12px 0 26px;color:var(--muted);font-size:17px}
.intro .meta{display:flex;gap:8px;margin-bottom:22px}
.pill{font-size:13px;padding:4px 11px;border-radius:30px;background:var(--soft);color:var(--muted)}
.intro .spacer{flex:1}

/* question */
.qtop{display:flex;align-items:center;gap:12px;margin:6px 0 26px}
.qtop .back{background:none;border:none;font-size:22px;line-height:1;padding:6px 8px 6px 0;color:var(--muted)}
.qbar{flex:1;height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--ink);border-radius:3px;transition:width .35s ease}
.qnum{font-family:var(--display);font-size:18px;color:var(--muted)}
.qtext{font-family:var(--display);font-size:27px;line-height:1.35;margin-bottom:24px;word-break:keep-all}
.opt{display:block;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 16px;margin-bottom:10px;font-size:16px;line-height:1.5;word-break:keep-all;transition:border-color .15s,transform .15s}
.opt:active{transform:scale(.985)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.qanim{animation:qin .32s ease both}
@keyframes qin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

/* lock */
.lock{text-align:center;padding-top:20px}
.lock .mystery{width:190px;margin:0 auto 6px}
.lock h2{font-family:var(--display);font-size:32px;line-height:1.25}
.lock p.desc{color:var(--muted);margin:12px 0 24px;word-break:keep-all}
.keyrow{display:flex;gap:8px}
.keyrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);font-size:17px;text-align:center}
.keyrow .btn{width:auto;flex:0 0 auto;padding:14px 20px}
.keymsg{min-height:24px;margin-top:10px;font-size:14px;color:var(--c-tolstoy)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.lockhint{margin-top:26px;font-size:14px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;word-break:keep-all}

/* result */
.hero{border-radius:26px;padding:22px 20px 26px;text-align:center;position:relative;overflow:hidden}
.hero .pre{font-size:15px;opacity:.85}
.hero .charbox{width:230px;margin:6px auto 0}
.hero .nick{font-family:var(--display);font-size:42px;line-height:1.1;margin-top:4px;letter-spacing:-.5px}
.badges{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.badge{font-size:14px;font-weight:600;padding:5px 13px;border-radius:30px;background:var(--surface);color:var(--ink)}
.reveal .charbox{animation:pop .7s cubic-bezier(.2,1.5,.4,1) both}
.reveal .nick,.reveal .badges{animation:fadeup .5s .35s ease both}
@keyframes pop{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.block{background:var(--surface);border-radius:20px;padding:20px;margin-top:14px}
.block h3{font-family:var(--display);font-size:20px;margin-bottom:8px}
.lead{font-family:var(--serif);font-size:18px;line-height:1.75;word-break:keep-all}
.quote{font-family:var(--serif);font-size:16px;line-height:1.8;border-left:4px solid;padding-left:14px;word-break:keep-all}
.dist .row{display:grid;grid-template-columns:76px 1fr 40px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.dist .track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}
.dist .fill{height:100%;border-radius:5px;transition:width .8s ease}
.dist .pct{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.duo .block{margin-top:0;display:flex;flex-direction:column}
.duo p{font-size:15px;line-height:1.55;word-break:keep-all}
.duo h3{font-size:18px;word-break:keep-all}
.far{display:flex;flex-direction:column;align-items:flex-start;gap:2px;margin-top:auto}
.far svg{width:64px;flex:0 0 auto}
.far b{font-family:var(--display);font-weight:400;font-size:19px;display:block;line-height:1.2;word-break:keep-all}
.stancenote{font-size:14px;color:var(--muted);margin-top:10px}

/* meeting */
.sec-title{font-family:var(--display);font-size:30px;line-height:1.2;margin:8px 0 8px}
.groupgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.gbtn{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;text-align:left}
.gbtn b{font-family:var(--display);font-weight:400;font-size:24px;display:block}
.gbtn span{font-size:13px;color:var(--muted);line-height:1.4;display:block;margin-top:2px}
.case{background:var(--surface);border-radius:20px;padding:20px;margin-top:14px}
.case h3{font-family:var(--display);font-size:24px;line-height:1.3;margin-bottom:10px}
.case p{font-family:var(--serif);font-size:16px;line-height:1.8;word-break:keep-all}
.ask{display:flex;align-items:center;gap:12px;margin:22px 0 12px}
.ask svg{width:64px;flex:0 0 auto}
.ask p{font-family:var(--display);font-size:21px;line-height:1.35;word-break:keep-all}
.verdict{border-radius:20px;padding:20px;margin-top:14px}
.verdict .vtop{display:flex;align-items:center;gap:12px}
.verdict .vtop svg{width:76px;flex:0 0 auto}
.verdict .vlabel{font-size:14px;opacity:.8}
.verdict .vdec{font-family:var(--display);font-size:24px;line-height:1.25}
.verdict .vreason{font-family:var(--serif);font-size:16px;line-height:1.8;margin-top:12px;word-break:keep-all}
.hit{font-family:var(--display);font-size:20px;margin-top:16px;text-align:center}
textarea{width:100%;min-height:76px;margin-top:6px;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px;resize:vertical}
.summary{border-radius:26px;padding:24px 20px;text-align:center}
.summary svg{width:120px;margin:0 auto;display:block}
.summary .big{font-family:var(--display);font-size:28px;line-height:1.35;margin-top:8px;word-break:keep-all}
.summary .why{font-family:var(--serif);font-size:16px;line-height:1.7;margin-top:12px;word-break:keep-all}
.tip{margin-top:14px;font-size:14px;color:var(--muted);text-align:center;word-break:keep-all}
.gap{height:12px}

/* teacher */
.qrwrap{text-align:center;padding-top:10px}
.qrwrap input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);margin:14px 0}
.qrbox{display:inline-block;background:#fff;padding:16px;border-radius:16px;line-height:0}

@media (prefers-reduced-motion: reduce){
  .qanim,.reveal .charbox,.reveal .nick,.reveal .badges,.shake{animation:none}
  .qbar i,.dist .fill{transition:none}
}
</style>
</head>
<body>
<main id="app" class="wrap"></main>
<script>
(function(){
"use strict";

/* ===== 사상가 ===== */
var T = {
  plato:{name:"플라톤",nick:"마음의 수호자",stance:"moral",
    intro:"예술이 사람의 품성을 만든다고 믿어요. 아무리 아름다운 작품이라도 마음을 해친다면 걸러 내야 한다고 생각하죠.",
    core:"예술은 올바른 품성을 위한 삶의 모범을 보여 주어야 하며, 예술가는 도덕적 이상을 모방하여 영혼의 조화를 추구해야 한다.",
    shake:"지키려는 마음이 누군가의 표현을 막는 쪽으로 기울 때",far:"wilde"},
  tolstoy:{name:"톨스토이",nick:"감정의 연결자",stance:"moral",
    intro:"사람과 사람을 잇는 감정이 예술의 가치라고 생각해요. 소수만 즐기는 작품보다 모두의 마음에 닿는 작품을 더 아끼죠.",
    core:"미각의 만족이 음식의 가치를 정하지 못하듯, 예술의 가치는 즐거움이 아니라 인류의 사랑과 선을 완성하는 데 있다.",
    shake:"감동적이지만 해로운 메시지를 담은 작품 앞에서",far:"spingarn"},
  confucius:{name:"공자",nick:"인격의 감식가",stance:"moral",
    intro:"작품 뒤에 있는 사람을 봐요. 만든 사람의 마음이 바르지 않으면 작품도 온전히 아름다울 수 없다고 느끼죠.",
    core:"음악은 사람의 성품과 이어져 있다. 사람이 어질지 않으면 예와 음악을 할 수 없다.",
    shake:"오래 사랑해 온 작품의 작가가 잘못을 저질렀을 때",far:"spingarn"},
  xunzi:{name:"순자",nick:"공동체의 조율자",stance:"moral",
    intro:"예술은 함께 사는 사람들을 조화롭게 해야 한다고 생각해요. 들뜬 마음을 다스리고 모두를 하나로 묶는 예술을 좋아하죠.",
    core:"음악은 사람의 악한 본성을 교화하여 예를 기르고, 사회를 조화롭게 다스리는 바탕이 된다.",
    shake:"다수가 낯설어하는 새로운 작품 앞에서",far:"wilde"},
  wilde:{name:"와일드",nick:"자유로운 창조자",stance:"aes",
    intro:"예술가는 누구의 요구에도 따르지 않아야 한다고 믿어요. 남의 눈치를 보는 순간 독창성은 사라진다고 생각하죠.",
    core:"다른 사람의 욕구를 만족시키려는 순간 예술가는 예술가이기를 포기한 것이며, 윤리적 공감은 예술가의 독창성을 잃게 한다.",
    shake:"그 자유가 누군가에게 실제로 상처를 줄 때",far:"plato"},
  spingarn:{name:"스핑건",nick:"순수한 비평가",stance:"aes",
    intro:"작품은 작품 그 자체로 평가해야 한다고 생각해요. 작가의 삶이나 도덕의 잣대보다 완성도와 아름다움을 먼저 보죠.",
    core:"시가 도덕적이라거나 비도덕적이라고 말하는 것은 정삼각형은 도덕적이고 이등변 삼각형은 비도덕적이라고 말하는 것만큼 무의미하다.",
    shake:"작품이 실제로 누군가를 해칠 때",far:"tolstoy"}
};
var ORDER=["plato","tolstoy","confucius","xunzi","wilde","spingarn"];
function J(w,a,b){var c=w.charCodeAt(w.length-1);var bat=(c>=0xAC00&&c<=0xD7A3)&&((c-0xAC00)%28!==0);return w+(bat?a:b);}
var STANCE={moral:"도덕주의",aes:"심미주의"};

/* ===== 문항 ===== */
var Q=[
 {q:"좋아하던 가수의 과거 잘못이 크게 알려졌다. 노래는 그 잘못과 관련이 없다. 내 플레이리스트에서 그 노래는?",o:[
  ["그대로 둔다. 노래는 노래일 뿐이다.",{spingarn:1}],
  ["지운다. 그런 사람이 만든 노래에서 예전 같은 감동을 느낄 수 없다.",{confucius:1}],
  ["혼자 듣는 건 괜찮지만, 반 응원가나 행사 노래로 쓰는 건 반대한다.",{xunzi:1}],
  ["그 노래가 많은 사람을 위로해 왔다는 게 더 중요하다.",{tolstoy:1}]]},
 {q:"미술 수행평가로 작품을 만든다. 나는 어떤 작품을 만들고 싶나?",o:[
  ["보는 사람이 더 나은 사람이 되고 싶어지는 작품",{plato:1}],
  ["남이 어떻게 보든 상관없이, 아무도 시도하지 않은 나만의 작품",{wilde:1}],
  ["형태와 색의 조화가 완벽한 작품. 메시지는 필요 없다.",{spingarn:1}],
  ["누구든 보고 같은 감정을 느껴 서로 가까워지는 작품",{tolstoy:1}]]},
 {q:"학교 축제 무대에 올릴 공연을 고른다. 가장 중요한 기준은?",o:[
  ["다 함께 즐기되, 선을 넘지 않는가",{xunzi:1}],
  ["관객, 특히 후배들에게 나쁜 영향을 주지 않는가",{plato:1}],
  ["무대의 완성도가 얼마나 높은가",{spingarn:.5,wilde:.5}],
  ["공연하는 사람들이 진심을 담을 수 있는가",{confucius:1}]]},
 {q:"웹툰에 폭력적인 장면이 점점 많아져서 청소년에게 해롭다는 비판이 나왔다. 내 생각은?",o:[
  ["청소년이 따라 할 수 있으니 수위를 조절해야 한다.",{plato:1}],
  ["이야기에 필요한 장면이라면 작가가 정할 일이다. 독자 눈치를 보면 작품이 망가진다.",{wilde:1}],
  ["장면이 폭력적인지보다 작품이 잘 만들어졌는지를 봐야 한다.",{spingarn:1}],
  ["그 장면이 사람들 사이에 공감을 만드는지, 상처를 주는지가 중요하다.",{tolstoy:1}]]},
 {q:"존경받던 화가가 사실은 남을 괴롭히며 살았다는 기록이 발견되었다. 그 그림은?",o:[
  ["그림의 가치는 그대로다. 그림에 도덕을 묻는 것 자체가 이상하다.",{spingarn:1}],
  ["마음이 비뚤어진 사람의 그림이 정말 아름다울 수 있을까 싶다.",{confucius:1}],
  ["예술가는 원래 세상의 규칙 밖에 있는 사람이다. 그 자유가 있어야 걸작이 나온다.",{wilde:1}],
  ["학생들이 그런 사람을 본받을까 봐 걱정된다.",{plato:1}]]},
 {q:"친구가 ‘유치하다’는 평을 듣는 노래를 좋아한다. 하지만 그 노래 덕분에 힘든 시기를 버텼다고 한다. 이 노래는 좋은 예술일까?",o:[
  ["그렇다. 사람의 마음을 움직이고 이어 줬다면 좋은 예술이다.",{tolstoy:1}],

function scores(){

}
function topType(){
  var p=scores(), best=null;
  ORDER.forEach(function(k){ if(best===null||p[k]>p[best]+1e-9)best=k; });
  var tied=ORDER.filter(function(k){return Math.abs(p[k]-p[best])<1e-9;});
  if(tied.length>1){
    for(var qi=Q.length-1;qi>=0;qi--){
      var ai=S.ans[qi]; if(ai==null)continue;
      var m=Q[qi].o[ai][1], pick=tied.filter(function(k){return m[k];});
      if(pick.length===1)return pick[0];
      if(pick.length>1){tied=pick;}
    }

  }
  return best;
}

  '<div class="block"><h3>'+J(t.name,'은','는')+' 이렇게 말했어요</h3><p class="quote" style="border-color:var(--c-'+k+')">'+esc(t.core)+'</p>'+
  '<p class="stancenote">'+(t.stance==="moral"?"도덕주의: 미적 가치와 도덕적 가치가 밀접하다고 보는 입장":"심미주의: 예술은 윤리로부터 분리되어 미적 가치로 판단해야 한다는 입장")+'</p></div>'+
  '<div class="duo"><div class="block"><h3>흔들리는 지점</h3><p>'+esc(t.shake)+'</p></div>'+
  '<div class="block"><h3>가장 먼 철학자</h3><div class="far">'+charSVG(t.far)+'<div><b style="color:var(--c-'+t.far+')">'+f.nick+'</b><span class="muted" style="font-size:13px">'+f.name+'형</span></div></div></div></div>'+
  '<div class="block dist"><h3>나의 판단 성향</h3>'+bars+'</div>'+
  '<div style="text-align:center;margin-top:22px"><button class="linkish" data-act="reset">처음부터 다시 하기</button></div>';
}
function vGroup(){
  return '<h2 class="sec-title">철학자 회의</h2><p class="muted">이제 여러분의 철학자와 함께 실제 안건을 판단합니다. 우리 모둠 번호를 고르세요.</p>'+
  '<div class="groupgrid">'+[1,2,3,4].map(function(g){return '<button class="gbtn" data-act="group" data-g="'+g+'"><b>'+g+'모둠</b><span>'+esc(CASES[GROUP_CASE[g]].title)+'</span></button>';}).join("")+'</div>'+
  '<div class="gap"></div><button class="btn light" data-act="toResult">내 결과 다시 보기</button>';
}
function caseBlock(c){
  return '<div class="case"><h3>'+esc(c.title)+'</h3><p>'+esc(c.text)+'</p>'+(c.src?'<p class="muted" style="font-family:var(--sans);font-size:13px;margin-top:8px">'+esc(c.src)+'</p>':'')+'</div>';
}
function vPredict(){
  var k=topType(), t=T[k], c=CASES[GROUP_CASE[S.group]];
  return '<h2 class="sec-title">'+S.group+'모둠의 안건</h2>'+caseBlock(c)+
  '<div class="ask">'+charSVG(k)+'<p>'+J(t.name,'이라면','라면')+' 이 안건에 뭐라고 할까요? 예측해 보세요.</p></div>'+
  '<p class="muted" style="margin-bottom:10px;font-size:15px">'+esc(c.question)+'</p>'+
  VKEYS.map(function(v){return '<button class="opt" aria-pressed="'+(S.pred===v)+'" data-act="pred" data-v="'+v+'">'+esc(c.opts[v])+'</button>';}).join("")+
  '<div class="gap"></div><button class="btn" data-act="toCheck" '+(S.pred?"":"disabled")+'>'+t.name+'의 답 확인하기</button>';
}
function vCheck(){
  var k=topType(), t=T[k], c=CASES[GROUP_CASE[S.group]], v=c.v[k], ok=S.pred===v[0];
  return '<h2 class="sec-title">'+t.name+'의 판단</h2>'+
  '<div class="verdict" style="background:var(--s-'+k+')"><div class="vtop">'+charSVG(k)+'<div><p class="vlabel">'+t.name+'의 관점에서 보면</p><p class="vdec" style="color:var(--c-'+k+')">'+esc(c.opts[v[0]])+'</p></div></div>'+
  '<p class="vreason">'+esc(v[1])+'</p></div>'+
  '<p class="hit">'+(ok?"예측 성공! "+J(t.name,"을","를")+" 제대로 이해했어요.":"예측과 달랐어요.<br><span class=\"muted\" style=\"font-family:var(--sans);font-size:15px\">내가 예측한 답: "+esc(c.opts[S.pred])+"</span>")+'</p>'+
  '<div class="gap"></div><button class="btn" data-act="toMine">그런데, 진짜 나는?</button>';
}
function vMine(){
  var k=topType(), t=T[k], c=CASES[GROUP_CASE[S.group]];
  return '<h2 class="sec-title">그런데, 진짜 나는?</h2><p class="muted">'+t.name+'형이라고 해서 '+J(t.name,'과','와')+' 같은 판단을 할 필요는 없어요. 안건을 다시 보고 나의 판단을 고르세요.</p>'+
  '<p style="margin:18px 0 10px;font-weight:600">'+esc(c.question)+'</p>'+
  VKEYS.map(function(v){return '<button class="opt" aria-pressed="'+(S.mine===v)+'" data-act="mine" data-v="'+v+'">'+esc(c.opts[v])+'</button>';}).join("")+
  '<label for="why" style="display:block;margin-top:16px;font-size:15px;font-weight:600">이유를 한 줄로</label>'+
  '<textarea id="why" maxlength="80" placeholder="모둠 친구들에게 말할 이유를 적어 보세요">'+esc(S.why)+'</textarea>'+
  '<div class="gap"></div><button class="btn" id="mineBtn" data-act="toSummary" '+(S.mine?"":"disabled")+'>나의 판단 카드 만들기</button>';
}
function vSummary(){
  var k=topType(), t=T[k], c=CASES[GROUP_CASE[S.group]], tv=c.v[k][0], same=S.mine===tv;
  var line = same ? '나는 <span style="color:var(--c-'+k+')">'+t.name+'형</span>이고, 이 안건에서도 '+J(t.name,'과','와')+' 같은 판단을 했다.'
                  : '나는 <span style="color:var(--c-'+k+')">'+t.name+'형</span>이지만, 이 안건에서는 '+J(t.name,'과','와')+' 다른 판단을 했다.';
  return '<section class="summary" style="background:var(--s-'+k+')">'+charSVG(k)+
  '<p class="big">'+line+'</p>'+
  '<div class="badges" style="margin-top:14px"><span class="badge">'+t.name+': '+esc(c.opts[tv])+'</span><span class="badge">나: '+esc(c.opts[S.mine])+'</span></div>'+
  (S.why.trim()?'<p class="why">“'+esc(S.why.trim())+'”</p>':'')+'</section>'+
  '<p class="tip">이 화면을 모둠 친구들에게 보여 주며 한 사람씩 이야기해 보세요. “내 철학자는 이렇게 봤고, 나는 이렇게 생각해.”</p>'+
  '<div class="gap"></div><button class="btn light" data-act="toMine">판단 다시 고르기</button>'+
  '<div style="text-align:center;margin-top:18px"><button class="linkish" data-act="reset">처음부터 다시 하기</button></div>';
}
var QRLINK="art-philo-qrlink";
function vQR(){
  var link=""; try{link=localStorage.getItem(QRLINK)||"";}catch(e){}
  if(!link && /^https?:/.test(location.protocol)) link=location.href.split("#")[0];
  return '<section class="qrwrap"><h2 class="sec-title">QR을 찍고 들어오세요</h2>'+
  '<div class="qrbox" id="qrbox" aria-label="입장 QR 코드"></div>'+
  '<input id="qrlink" type="url" placeholder="이 사이트의 주소" value="'+esc(link)+'" aria-label="공유 링크">'+
  '<button class="btn light" data-act="home">돌아가기</button></section>';
}

function render(opt){
  opt=opt||{};
  var v;
  switch(S.screen){
    case "q":v=vQuestion();break;
    case "lock":v=vLock();break;
    case "result":v=vResult(opt.reveal);break;
    case "group":v=vGroup();break;
    case "predict":v=vPredict();break;
    case "check":v=vCheck();break;
    case "mine":v=vMine();break;
    case "summary":v=vSummary();break;
    case "qr":v=vQR();break;
    default:v=vIntro();
  }
  app.innerHTML=v;
  if(S.screen==="lock"){
    var ki=document.getElementById("keyin");
    ki.addEventListener("keydown",function(e){if(e.key==="Enter")tryUnlock();});
  }
  if(S.screen==="mine"){
    var w=document.getElementById("why");
    w.addEventListener("input",function(){S.why=w.value;save();});
  }
  if(S.screen==="qr"){
    var li=document.getElementById("qrlink");
    var draw=function(){var b=document.getElementById("qrbox");b.innerHTML="";var l=li.value.trim();try{localStorage.setItem(QRLINK,l);}catch(e){}
      if(!l){b.style.display="none";return;} b.style.display="";
      if(typeof window.QRCode==="function"){try{new window.QRCode(b,{text:l,width:260,height:260,correctLevel:window.QRCode.CorrectLevel.M});}catch(e){b.textContent="QR을 만들 수 없는 링크예요.";}}
      else b.textContent="QR 도구를 불러오지 못했어요.";};
    li.addEventListener("input",draw); draw();
  }
}

function tryUnlock(){
  var ki=document.getElementById("keyin"), msg=document.getElementById("keymsg"), row=document.getElementById("keyrow");
  var v=norm(ki.value);
  if(KEYS.indexOf(v)>=0){ go({screen:"result",unlocked:true},{reveal:true}); return; }
  msg.textContent = v ? "열쇠가 맞지 않아요. 오늘 배운 개념을 떠올려 보세요." : "열쇠를 입력하세요.";
  row.classList.remove("shake"); void row.offsetWidth; row.classList.add("shake");
}

var armed=null;
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b||b.disabled)return;
  var a=b.getAttribute("data-act");
  switch(a){
    case "start": go({screen:"q",qi:0}); break;
    case "answer":
      var i=+b.getAttribute("data-i"); S.ans[S.qi]=i; save();
      b.setAttribute("aria-pressed","true");
      setTimeout(function(){ if(S.qi<Q.length-1) go({qi:S.qi+1}); else go({screen:"result"},{reveal:true}); },180);
      break;
    case "prevq": if(S.qi>0) go({qi:S.qi-1}); else go({screen:"intro"}); break;
    case "unlock": tryUnlock(); break;
    case "redo": go({screen:"q",qi:0}); break;
    case "meeting": go({screen:S.group?"predict":"group"}); break;
    case "toResult": go({screen:"result"}); break;
    case "group": go({screen:"predict",group:+b.getAttribute("data-g"),pred:null,mine:null,why:""}); break;
    case "pred": S.pred=b.getAttribute("data-v"); save(); render(); break;
    case "toCheck": go({screen:"check"}); break;
    case "toMine": go({screen:"mine"}); break;
    case "mine": S.mine=b.getAttribute("data-v"); save(); render(); break;
    case "toSummary": go({screen:"summary"}); break;
    case "qr": go({screen:"qr"}); break;
    case "home": go({screen:S.ans.length>=Q.length?"result":(S.ans.length?"q":"intro")}); break;
    case "reset":
      if(armed===b){ armed=null; S=fresh(); save(); render(); window.scrollTo(0,0); }
      else { armed=b; var o=b.textContent; b.textContent="한 번 더 누르면 처음부터 시작해요"; setTimeout(function(){ if(armed===b){armed=null; if(b.isConnected)b.textContent=o;} },3000); }
      break;
  }
});

/* 이전 버전 상태 보정 */
if(S.screen==="q"&&(S.qi<0||S.qi>=Q.length))S.qi=0;
if(["lock","result","group","predict","check","mine","summary"].indexOf(S.screen)>=0)S.screen=(S.ans.length>=Q.length?"result":"intro");
render();
})();
</script>
</body>
</html>
