<head>

<style>
:root{
  --bg:#F3F4F7; --surface:#FFFFFF; --ink:#1A1D24; --muted:#5D6472; --line:#DDE1E7; --soft:#ECEEF2;
  --c-plato:#2F55B4; --s-plato:#DFE7FA; --c-tolstoy:#C2416A; --s-tolstoy:#F9DFE7;
  --c-confucius:#23805A; --s-confucius:#D9F0E5; --c-xunzi:#B0721A; --s-xunzi:#F7E8CD;
  --c-wilde:#7B3DB3; --s-wilde:#ECDFF8; --c-spingarn:#177A8D; --s-spingarn:#D4EEF3;
  --paper:#FBF7EE; --paper-edge:#E9DFC8; --face:#1A1D24; --cheek:#FF8FA3;
  --ok:#23805A; --warn:#B0721A;
  --display:"Do Hyeon","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --serif:"Gowun Batang","Nanum Myeongjo","AppleMyungjo","Batang",serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:18px;line-height:1.6;word-break:keep-all}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--c-plato);outline-offset:2px}
p{margin:0} h1,h2,h3{margin:0;font-weight:400}
.wrap{max-width:1100px;margin:0 auto;padding:20px 22px 48px}
.wrap.wide{max-width:1500px}
.btn{border:none;border-radius:12px;padding:13px 22px;background:var(--ink);color:#fff;font-weight:600;font-size:17px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.light{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.big{font-size:20px;padding:16px 28px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* 상단바 */
.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.who{font-family:var(--display);font-size:26px}
.conn{font-size:13px;padding:4px 10px;border-radius:20px;background:var(--soft);color:var(--muted)}
.conn.on{background:#DDF1E6;color:var(--ok)}
.steps{display:flex;gap:6px;flex:1;min-width:260px}
.steps div{flex:1}
.steps i{display:block;height:6px;border-radius:3px;background:var(--line)}
.steps span{display:block;font-size:12px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps .open i{background:var(--muted)}
.steps .now i{background:var(--ink)} .steps .now span{color:var(--ink);font-weight:600}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 14px;font-size:15px}
.tab[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab:disabled{opacity:.4}

/* 첫 화면 */
.pick{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-top:22px}
.pick button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:left}
.pick b{display:block;font-family:var(--display);font-size:30px;font-weight:400}

/* 내용 카드 */
.paper{background:var(--paper);border:1px solid var(--paper-edge);border-radius:20px;padding:clamp(20px,3vw,38px)}
.tag{display:inline-block;font-size:14px;font-weight:600;padding:3px 12px;border-radius:30px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.title{font-family:var(--display);font-size:clamp(30px,4vw,48px);line-height:1.2;margin-bottom:14px}
.story p{font-family:var(--serif);font-size:clamp(19px,2vw,24px);line-height:1.85}
.story p+p{margin-top:14px}
.story .voice{font-weight:700}
.fig{margin:0 0 18px}
.fig svg{display:block;width:100%;height:auto;max-height:58vh;border-radius:12px}
.q{font-family:var(--display);font-size:clamp(24px,3vw,34px);margin-top:18px}
.scaleline{display:flex;justify-content:space-between;font-size:15px;font-weight:600;margin-top:6px}

/* 잠금 화면 */
.locked{text-align:center;padding:60px 20px;background:var(--surface);border:2px dashed var(--line);border-radius:20px}
.locked h2{font-family:var(--display);font-size:32px;margin:10px 0}
.keyrow{display:flex;gap:8px;justify-content:center;margin-top:18px}
.keyrow input{border:1px solid var(--line);border-radius:10px;padding:12px;width:200px;text-align:center;font-size:18px}

/* 입력 */
.form{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,3vw,32px);display:flex;flex-direction:column;gap:16px}
.form h2{font-family:var(--display);font-size:30px}
.scores{display:grid;grid-template-columns:repeat(11,1fr);gap:6px}
.scores button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 0;font-family:var(--display);font-size:22px}
.scores button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--bg);font-family:var(--serif);font-size:19px;resize:vertical}
.hint{font-size:15px;color:var(--muted)}

/* AI 응답 */
.ai{background:#F1F4FC;border:1px solid #D3DCF3;border-radius:20px;padding:clamp(20px,3vw,32px)}
.ai h3{font-family:var(--display);font-size:26px;color:var(--c-plato);margin-bottom:10px}
.ai .text{font-family:var(--serif);font-size:20px;line-height:1.85;white-space:pre-wrap}
.ai .note{font-size:13px;color:var(--muted);margin-top:12px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid #C7D2F0;border-top-color:var(--c-plato);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* 결과 */
.done{background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--ok);border-radius:16px;padding:20px 24px}
.done b{font-family:var(--display);font-size:26px;font-weight:400}

/* 교사 화면 */
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:15px}
.gcard b{font-family:var(--display);font-size:22px;font-weight:400}
.gcard .s{font-family:var(--display);font-size:20px;color:var(--c-plato)}
.gcard p{margin-top:6px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:6px}
.dot.y{background:var(--ok)}
.codes{background:var(--surface);border:1px dashed var(--warn);border-radius:14px;padding:12px 16px;font-size:15px}
.timer{font-family:var(--display);font-size:34px;font-variant-numeric:tabular-nums;min-width:3.2ch}
.tiny{background:none;border:none;color:var(--muted);text-decoration:underline;font-size:14px}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
</style>
<style>
/* 공지 */
.notice{border-radius:12px;padding:12px 16px;font-weight:600;background:#FDECEE;color:#9B2C3E;border:1px solid #F3C3CB}
.notice[hidden]{display:none}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* 타이머 (모둠 상단, 교사 제어) */
.tpill{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:30px;padding:6px 16px;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums}
.tpill.paused{background:var(--muted)}
.tpill.over{background:#C2416A}
.tpill small{font-family:var(--sans);font-size:12px;opacity:.8}
.tctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.tctrl .timer{min-width:3.6ch;text-align:center}
.tctrl .timer.over{color:#C2416A}
.tctrl button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;font-size:15px}
.tctrl button.main{background:var(--ink);color:#fff;border-color:var(--ink)}

/* 채팅 */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;margin-top:18px}
.chat header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);background:#F1F4FC}
.chat header b{font-family:var(--display);font-size:24px;font-weight:400;color:var(--c-plato)}
.msgs{display:flex;flex-direction:column;gap:12px;padding:18px 20px;max-height:52vh;min-height:220px;overflow-y:auto}
.msg{max-width:82%;border-radius:16px;padding:12px 16px;font-size:18px;line-height:1.7;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:#EEF2FB;border:1px solid #D3DCF3;font-family:var(--serif)}
.msg.user{align-self:flex-end;background:var(--ink);color:#fff}
.msg .who{display:block;font-family:var(--sans);font-size:12px;font-weight:600;opacity:.7;margin-bottom:4px}
.msg.typing{color:var(--muted)}
.composer{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{min-height:56px;max-height:160px;font-size:18px}
.composer .btn{flex:0 0 auto}
.chatnote{font-size:13px;color:var(--muted);padding:0 20px 14px}

.gcard .last{margin-top:6px;font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}

/* 활동 보드 */
.board{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.bhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.bhead b{font-family:var(--display);font-size:28px;font-weight:400}
.spec{position:relative;height:150px;margin:14px 18px 8px}
.spec .axis{position:absolute;left:0;right:0;bottom:30px;height:6px;border-radius:3px;background:linear-gradient(90deg,#C2416A,#DDE1E7 50%,#177A8D)}
.spec .tick{position:absolute;bottom:4px;transform:translateX(-50%);font-size:13px;color:var(--muted)}
.spec .pin{position:absolute;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;color:#fff;font-family:var(--display);font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px #00000022}
.spec .end{position:absolute;top:0;font-size:13px;font-weight:600}
.spec .end.l{left:0;color:#C2416A}.spec .end.r{right:0;color:#177A8D}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:10px}
.post{background:var(--bg);border:1px solid var(--line);border-top:6px solid;border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.post .ptop{display:flex;justify-content:space-between;align-items:baseline}
.post .ptop b{font-family:var(--display);font-size:22px;font-weight:400}
.post .me{font-family:var(--sans);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
.post .pscore{font-family:var(--display);font-size:30px}
.post .preason{font-family:var(--serif);font-size:18px;line-height:1.7}
.like{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:4px 14px;font-size:14px}
.like.on{background:#FDECEE;border-color:#F3C3CB;color:#9B2C3E}
.like:disabled{opacity:.6;cursor:default}
.cmts p{font-size:15px;margin-top:4px}
.cin{display:flex;gap:6px}
.cin input{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:15px;background:var(--surface)}
.cin .btn{padding:8px 14px;font-size:14px}
.msg .fb{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:6px}

/* 봉투 열림 효과 */
.envfx{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:rgba(243,244,247,.94);animation:fxOut .45s ease 2.3s forwards}
.envfx .env{position:relative;width:min(380px,72vw);aspect-ratio:3/2;perspective:1000px}
.envfx .back{position:absolute;inset:0;background:#E3CFA6;border-radius:12px;box-shadow:0 18px 40px rgba(60,40,10,.25)}
.envfx .letter{position:absolute;left:7%;right:7%;top:8%;height:84%;z-index:1;background:#FFFDF6;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;animation:letterUp .9s cubic-bezier(.2,.8,.2,1) .95s forwards}
.envfx .letter small{font-size:15px;color:var(--muted);font-weight:600}
.envfx .letter b{font-family:var(--display);font-weight:400;font-size:clamp(24px,4vw,34px)}
.envfx .front{position:absolute;inset:0;z-index:2;background:#F1E2C2;border-radius:12px;clip-path:polygon(0 34%,50% 70%,100% 34%,100% 100%,0 100%)}
.envfx .flap{position:absolute;left:0;right:0;top:0;height:66%;z-index:3;transform-origin:top center;background:linear-gradient(#E9D5AC,#DCC394);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:12px 12px 0 0;animation:flapOpen .75s ease .3s forwards}
.envfx .seal{position:absolute;left:50%;top:52%;z-index:4;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#C2416A;color:#fff;font-family:var(--display);font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.25);animation:sealOff .3s ease .15s forwards}
.envfx .cap{font-family:var(--display);font-size:clamp(22px,3.4vw,30px);opacity:0;animation:capIn .4s ease 1.3s forwards}
@keyframes flapOpen{0%{transform:rotateX(0)}100%{transform:rotateX(180deg);z-index:0}}
@keyframes letterUp{to{transform:translateY(-58%)}}
@keyframes sealOff{to{transform:scale(.4);opacity:0}}
@keyframes capIn{to{opacity:1}}
@keyframes fxOut{to{opacity:0;visibility:hidden}}
@media (prefers-reduced-motion: reduce){.envfx{display:none}}
</style>

</head>
<body>
<main id="app" class="wrap"></main>
<script>
(function(){
"use strict";
var C=window.CONFIG;

/* ================= 내용 ================= */
var CASE={
  tag:"작가의 문제", title:"우리 학교 벽화, 어떻게 해야 할까?",
  story:[
    "우리 학교 본관 외벽에는 길이 40m의 벽화 「함께 자라는 숲」이 있습니다. 10년 전, 이 학교 졸업생이자 지금은 세계적으로 인정받는 화가 한서진이 후배들과 함께 그리기 시작했고, 이후 해마다 3학년이 졸업 전에 한 칸씩 이어 그려 왔습니다. 올해 3학년의 빈칸은 다음 주에 채워질 예정이었죠.",
    "그런데 한서진이 과거 미술 학원을 운영하며 10대 수강생들에게 수년간 폭언과 폭행을 해 온 사실이 드러났고, 법원은 유죄를 확정했습니다. 학생 대의원회인 여러분이 학교에 의견을 내야 합니다."
  ],
  question:"이 벽화를 어떻게 해야 할까?", low:"0점 전부 지운다", high:"10점 그대로 보존한다"
};
var ENVS=[
  {title:"1,200명의 손", tag:"작품의 문제", fig:"hands",
   body:["벽화에서 한서진이 직접 그린 부분은 가운데 나무 한 그루뿐입니다. 나머지는 지난 10년간 졸업생 1,200명이 한 칸씩 그려 넣은 것이죠. 졸업생 커뮤니티에 이런 글이 올라왔습니다.",
         {voice:"“그 벽에는 제 열아홉 살이 있어요. 그 사람 때문에 우리 모두의 그림까지 지워야 하나요?”"},
         "벽화 일부만 지우는 건 기술적으로 불가능하다는 복원 업체의 답변도 왔습니다."]},
  {title:"입학식의 약속", tag:"사회의 문제", fig:"ceremony",
   body:["이 벽화 앞에서는 해마다 입학식이 열립니다. 교장 선생님은 신입생들에게 늘 이렇게 말해 왔어요. “선배 한서진처럼 큰 꿈을 꾸세요.” 피해자 중 한 명인 우리 학교 졸업생이 학교에 편지를 보냈습니다.",
         {voice:"“벽화를 부수라는 게 아니에요. 다만 그 사람의 이름 앞에서 후배들이 꿈을 배우는 일은 멈춰 주세요. 제가 그 학원에서 배운 건 꿈이 아니라 두려움이었으니까요.”"}]}
];
var PHASES=[
  {id:"case",name:"안건"},{id:"env1",name:"봉투 1"},{id:"env2",name:"봉투 2"},
  {id:"chat",name:"길라잡이와 토론"},{id:"final",name:"최종 결론과 활동 보드"}

/* ================= 입력 검증 ================= */
function isMeaningful(text,min){
  var t=String(text||"").trim();
  var compact=t.replace(/\s/g,"");
  if(compact.length<min) return false;
  var jamo=(compact.match(/[ㄱ-ㅎㅏ-ㅣ]/g)||[]).length;
  if(jamo/compact.length>0.3) return false;                 // ㅋㅋㅋ, ㅠㅠ, ㅎㅎ
  var words=(compact.match(/[가-힣A-Za-z0-9]/g)||[]).length;
  if(words/compact.length<0.6) return false;                // 기호·이모지 위주
  if(/(.{1,3})\1{3,}/.test(compact)) return false;          // 뿅뿅뿅뿅, 아아아아
  var uniq={}; for(var i=0;i<compact.length;i++)uniq[compact[i]]=1;
  if(Object.keys(uniq).length < Math.min(8, Math.ceil(compact.length*0.35))) return false;  // 같은 글자만 반복
  return true;
}

/* ================= 타이머 ================= */
function remainingNow(){ return timer.running ? Math.ceil((timer.endsAt-now())/1000) : timer.remaining; }
function fmt(s){var neg=s<0; s=Math.abs(s); var m=Math.floor(s/60),x=s%60; return (neg?"-":"")+m+":"+(x<10?"0":"")+x;}
function pushTimer(){ saveLocal(); if(ref) ref.child("timer").set(timer); paintTimer(); }
function tStart(){ if(timer.running)return; timer.running=true; timer.endsAt=now()+timer.remaining*1000; pushTimer(); }
function tPause(){ if(!timer.running)return; timer.remaining=Math.max(0,remainingNow()); timer.running=false; pushTimer(); }
function tReset(){ timer.running=false; timer.remaining=timer.duration; pushTimer(); }
function tAdjust(d){
  if(timer.running){ timer.endsAt+=d*1000; if(timer.endsAt<now()) timer.endsAt=now(); }
  else{ timer.duration=Math.max(10,timer.duration+d); timer.remaining=Math.max(0,timer.remaining+d); if(timer.remaining===0&&d>0)timer.remaining=d; }
  pushTimer();
}
function paintTimer(){
  var r=remainingNow(), over=r<=0;
  var els=document.querySelectorAll("[data-timer]");
  for(var i=0;i<els.length;i++){
    var el=els[i]; el.querySelector(".tv").textContent=fmt(Math.max(0,r));
    el.classList.toggle("over",over);
    el.classList.toggle("paused",!timer.running&&!over);
  }
  var pb=document.getElementById("tplay"); if(pb) pb.textContent=timer.running?"일시정지":"시작";
  var dur=document.getElementById("tdur"); if(dur) dur.textContent="설정 "+fmt(timer.duration);
}
setInterval(function(){ if(timer.running) paintTimer(); },250);

    h+= useLive
      ? '<div class="locked" style="margin-top:20px"><p class="muted">다음 단계</p><h2>'+next.name+'</h2><p class="muted">선생님이 열면 자동으로 나타나요.</p></div>'
      : '<div class="locked" style="margin-top:20px"><p class="muted">다음 단계</p><h2>'+next.name+'</h2><p class="muted">선생님의 안내를 들은 뒤 넘어가세요.</p><div class="keyrow"><button class="btn big" data-act="selfnext">'+next.name+' 열기</button></div></div>';
  }
  return h;
}
function vChat(){
  var p=mine.provisional||{};
  if(!mine.chat.length){
    return '<section class="form" id="pform"><h2>우리 모둠의 잠정 결론</h2><p class="hint">봉투 1, 2를 읽고 나눈 이야기를 바탕으로 점수와 이유를 정하면, 길라잡이와 토론이 시작돼요.</p>'+
      scoreButtons("p",p.score)+
      '<label for="preason" style="font-weight:600">그렇게 판단한 이유 (15자 이상, 구체적으로)</label>'+
      '<textarea id="preason" maxlength="500" placeholder="예: 작가의 잘못은 크지만, 잘못 없는 1,200명의 그림까지 지우는 건 지나치다고 생각했다.">'+esc(p.reason||"")+'</textarea>'+
      '<p class="notice" id="pnotice" role="alert" hidden>'+NOTICE+'</p>'+
      '<div class="row"><button class="btn big" data-act="startchat">길라잡이와 토론 시작</button></div></section>';
  }
  var turns=mine.chat.filter(function(m){return m.role==="user";}).length-1;
  var limit=turns>=C.chatMaxTurns;
  var h='<section class="chat"><header><b>길라잡이</b><span class="hint">잠정 결론 '+p.score+'점 · 반론 '+Math.max(0,turns)+'/'+C.chatMaxTurns+'회</span></header><div class="msgs" id="msgs">';
  mine.chat.forEach(function(m){ h+='<div class="msg '+(m.role==="user"?"user":"ai")+'"><span class="who">'+(m.role==="user"?group+"모둠":"길라잡이")+'</span>'+esc(m.text)+(m.fallback?'<span class="fb">길라잡이가 연결되지 않아 준비된 질문을 보여 드렸어요.'+(m.why?' (원인: '+esc(m.why)+')':'')+'</span>':'')+'</div>'; });
  if(sending) h+='<div class="msg ai typing"><span class="who">길라잡이</span><span class="spin"></span>생각하는 중…</div>';
  h+='</div>';
  if(limit) h+='<p class="chatnote" style="padding-top:12px">토론은 여기까지예요. 이제 모둠에서 최종 결론을 정해 보세요.</p>';
  else h+='<div class="composer"><textarea id="cmsg" maxlength="400" placeholder="길라잡이의 질문에 모둠의 생각이나 반론을 써 보세요."></textarea><button class="btn" data-act="send" '+(sending?"disabled":"")+'>보내기</button></div>'+
         '<p class="notice" id="cnotice" role="alert" hidden style="margin:0 16px 12px">'+NOTICE+'</p>';
  h+='<p class="chatnote">길라잡이의 말은 정답이 아니에요. 설득되는지, 아닌지 모둠에서 따져 보세요.</p></section>';
  return h;
}
function vFinal(){
  var f=mine.final||{}, p=mine.provisional||{};
  var h='';
  if(!f.saved){
    h+='<section class="form" id="fform"><h2>우리 모둠의 최종 결론</h2><p class="hint">길라잡이와의 토론을 바탕으로 최종 결론을 정하세요. 잠정 결론'+(typeof p.score==="number"?" "+p.score+"점":"")+'에서 바뀌어도, 그대로여도 괜찮아요.</p>'+
      scoreButtons("f",f.score)+
      '<label for="freason" style="font-weight:600">최종 결론의 이유 (15자 이상, 길라잡이의 질문을 어떻게 생각했는지 포함)</label><textarea id="freason" maxlength="500">'+esc(f.reason||"")+'</textarea>'+
      '<p class="notice" id="fnotice" role="alert" hidden>'+NOTICE+'</p>'+
      '<div class="row"><button class="btn big" data-act="savefinal">최종 결론을 보드에 올리기</button></div></section>';
  }else{
    var ch=typeof p.score==="number"?f.score-p.score:null;
    h+='<section class="done"><b>'+group+'모둠 최종 결론: '+f.score+'점</b><p style="margin-top:8px;font-family:var(--serif);font-size:19px">'+esc(f.reason)+'</p>'+
      (ch!==null?'<p class="hint" style="margin-top:8px">잠정 '+p.score+'점 → 최종 '+f.score+'점 ('+(ch===0?"그대로":(ch>0?"+"+ch:ch))+')</p>':'')+
      '<div class="row" style="margin-top:12px"><span class="hint">우리 반 활동 보드에 올라갔어요.</span><button class="tiny" data-act="editfinal">고치기</button></div></section>';
    h+='<div id="board" style="margin-top:18px"></div>';
  }
  return h;
}

/* ================= 교사 화면 ================= */
function vTeacher(){
  var h='<header class="top"><span class="who">교사 화면</span>'+stepper(phase,phase)+badge()+'</header>';
  h+='<div class="ctrl" style="margin-bottom:16px">'+
     '<button class="btn light" data-act="prev" '+(phase===0?"disabled":"")+'>이전 단계</button>'+
     '<button class="btn big" data-act="next" '+(phase>=PHASES.length-1?"disabled":"")+'>'+(phase<PHASES.length-1?PHASES[phase+1].name+" 열기":"마지막 단계")+'</button>'+
     '<div class="tctrl"><span class="timer" data-timer><span class="tv">0:00</span></span>'+
       '<button data-act="tminus">−10초</button><button data-act="tplus">+10초</button>'+
       '<button class="main" data-act="tplay" id="tplay">시작</button><button data-act="treset">리셋</button><span class="hint" id="tdur"></span></div>'+
     '<span style="flex:1"></span><button class="tiny" data-act="reset">새 수업으로 초기화</button></div>';
  var id=PHASES[phase].id, main='';
  if(id==="case") main=caseCard();
  else if(id==="env1") main=envCard(0);
  else if(id==="env2") main=envCard(1);
  else if(id==="chat") main='<article class="paper"><h2 class="title">길라잡이와 토론하기</h2><div class="story"><p>모둠의 잠정 결론(점수와 구체적인 이유)을 정하면 길라잡이가 반대편에서 질문을 던집니다. AI의 질문에 반론하며 대화를 이어 가세요.</p><p>길라잡이의 말은 정답이 아니에요. 설득되는지, 아닌지 모둠에서 따져 보세요.</p></div></article>';
  else main='<div id="board"></div>';
  h+='<div class="grid2"><div>'+main+'</div><aside id="side"></aside></div>';
  return h;
}
function sideHTML(){
  var h='<h3 style="font-family:var(--display);font-size:24px;margin-bottom:10px">모둠 진행 상황</h3>';
  if(!useLive) return h+'<p class="muted">실시간 연결을 설정하면 모둠의 잠정 결론, AI와의 대화, 최종 결론이 여기에 모입니다.</p>';
  h+='<div class="groups">';
  for(var i=1;i<=C.groupCount;i++){
    var g=groupsData[i]||{}, p=g.provisional||{}, f=g.final||{}, chat=g.chat||[];
    var turns=Math.max(0,chat.filter(function(m){return m.role==="user";}).length-1);
    var last=chat.length?chat[chat.length-1]:null;
    h+='<div class="gcard"><b>'+i+'모둠</b>'+
      '<p><span class="dot '+(typeof p.score==="number"?"y":"")+'"></span>잠정 '+(typeof p.score==="number"?'<span class="s">'+p.score+'점</span>':'-')+'</p>'+
      '<p><span class="dot '+(chat.length?"y":"")+'"></span>AI 토론 '+(chat.length?"반론 "+turns+"회":"-")+'</p>'+
      (last?'<p class="last">'+(last.role==="user"?"모둠: ":"AI: ")+esc(last.text).slice(0,70)+(last.text.length>70?"…":"")+'</p>':'')+
      '<p><span class="dot '+(f.saved?"y":"")+'"></span>최종 '+(f.saved?'<span class="s">'+f.score+'점</span>':'-')+'</p></div>';
  }
  return h+'</div>';
}
function renderSide(){ var s=document.getElementById("side"); if(s) s.innerHTML=sideHTML(); }

/* ================= AI 대화 ================= */
function apiMessages(){
  return mine.chat.map(function(m){return {role:m.role==="user"?"user":"assistant",content:m.text};});
}
function callAI(){
  var p=mine.provisional||{};
  sending=true; render(); scrollChat();
  var done=false, userTurns=mine.chat.filter(function(m){return m.role==="user";}).length;
  var to=setTimeout(function(){ if(!done){done=true; replyFallback(userTurns,p.score,"timeout");} },45000);
  fetch(C.aiEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({group:group,score:p.score,reason:p.reason,messages:apiMessages()})})
  .then(function(r){ return r.json().catch(function(){return {};}).then(function(d){ if(!r.ok){ var er=new Error("HTTP "+r.status); er.reason=d.reason||(r.status===504?"timeout":"http"+r.status); throw er; } return d; }); })
  .then(function(d){ if(done)return; done=true; clearTimeout(to); if(!d||!d.text){ var er=new Error("빈 응답"); er.reason="empty"; throw er; } addAI(d.text,false); })
  .catch(function(e){ if(done)return; done=true; clearTimeout(to); replyFallback(userTurns,p.score,(e&&e.reason)||"network"); });
}
var REASONS={timeout:"응답 시간 초과",nokey:"API 키 없음",key:"API 키 오류",model:"모델 이름 오류",quota:"사용 한도 초과",empty:"빈 응답",network:"인터넷 연결 문제",unknown:"알 수 없는 오류"};
function replyFallback(userTurns,score,reason){
  var t = userTurns<=1 ? fallbackFirst(score) : FALLBACK_FOLLOW[(userTurns-2)%FALLBACK_FOLLOW.length];
  addAI(t,true,REASONS[reason]||reason);
}
function addAI(text,fb,why){ sending=false; mine.chat.push({role:"ai",text:text,at:Date.now(),fallback:fb,why:why||null}); pushMine(); render(); scrollChat(); }
function scrollChat(){ var m=document.getElementById("msgs"); if(m) m.scrollTop=m.scrollHeight; }

function showNotice(id,formId){
  var n=document.getElementById(id); if(n){n.hidden=false;}
  var f=document.getElementById(formId); if(f){f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake");}
}

/* ================= 렌더와 이벤트 ================= */
function render(){
  app.className=role==="teacher"?"wrap wide":"wrap";
  if(!role){ app.innerHTML=vPick(); return; }
  var pr=document.getElementById("preason"), fr=document.getElementById("freason"), cm=document.getElementById("cmsg");
  if(pr){mine.provisional=mine.provisional||{};mine.provisional.reason=pr.value;}
  if(fr){mine.final=mine.final||{};mine.final.reason=fr.value;}
  var draft=cm?cm.value:null;
  app.innerHTML = role==="teacher"?vTeacher():vGroup();
  if(draft!==null){ var c2=document.getElementById("cmsg"); if(c2) c2.value=draft; }
  if(role==="teacher") renderSide();
  renderBoard(); paintBadge(); paintTimer();
}
app.addEventListener("input",function(e){
  if(e.target.id==="preason"){mine.provisional=mine.provisional||{};mine.provisional.reason=e.target.value;saveLocal();}
  if(e.target.id==="freason"){mine.final=mine.final||{};mine.final.reason=e.target.value;saveLocal();}
});
app.addEventListener("keydown",function(e){
  if(e.target.id==="cmsg"&&e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); sendMsg(); }
});
function sendMsg(){
  if(sending) return;
  var c=document.getElementById("cmsg"); if(!c) return;
  var t=c.value.trim();
  if(!isMeaningful(t,C.chatMinLength)){ showNotice("cnotice","msgs"); return; }
  mine.chat.push({role:"user",text:t,at:Date.now()}); c.value=""; pushMine(); callAI();
}
var armed=false;
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]"); if(!b||b.disabled) return;
  var a=b.getAttribute("data-act");
  if(a==="pick"){
    role=b.getAttribute("data-role"); group=role==="group"?+b.getAttribute("data-g"):null;
    location.hash=role==="teacher"?"teacher":"group-"+group;
    loadLocal(); initLive(); render(); return;
  }
  if(a==="regroup"){ if(!confirm("모둠을 다시 고를까요? 이 기기에서 쓰던 내용은 그대로 남아요.")) return; location.hash=""; location.reload(); return; }
  if(a==="view"){ view=+b.getAttribute("data-v"); saveLocal(); render(); window.scrollTo(0,0); if(PHASES[view].id==="chat") scrollChat(); return; }
  if(a==="selfnext"){ if(phase<PHASES.length-1){phase++;view=phase;saveLocal();render();window.scrollTo(0,0);fxForPhase(phase);} return; }
  if(a==="score"){
    var key=b.getAttribute("data-name")==="p"?"provisional":"final";
    mine[key]=mine[key]||{}; mine[key].score=+b.getAttribute("data-v"); saveLocal(); render(); return;
  }
  if(a==="startchat"){
    var p=mine.provisional||{}, pr=document.getElementById("preason"); p.reason=pr?pr.value.trim():"";
    if(typeof p.score!=="number"){ alert("먼저 0~10 사이에서 점수를 골라 주세요."); return; }
    if(!isMeaningful(p.reason,C.reasonMinLength)){ showNotice("pnotice","pform"); return; }
    mine.provisional=p; p.at=Date.now();
    mine.chat=[{role:"user",text:"잠정 결론: "+p.score+"점\n이유: "+p.reason,at:Date.now()}];
    pushMine(); callAI(); return;
  }
  if(a==="send"){ sendMsg(); return; }
  if(a==="savefinal"){
    var f=mine.final||{}, fr=document.getElementById("freason"); f.reason=fr?fr.value.trim():"";
    if(typeof f.score!=="number"){ alert("먼저 0~10 사이에서 점수를 골라 주세요."); return; }
    if(!isMeaningful(f.reason,C.reasonMinLength)){ showNotice("fnotice","fform"); return; }
    f.saved=true; f.at=Date.now(); mine.final=f; pushMine(); postToBoard(); render(); return;
  }
  if(a==="editfinal"){ mine.final.saved=false; pushMine(); render(); return; }
  if(a==="like"){
    var tg=+b.getAttribute("data-g"); if(!ref||tg===group) return;
    var lk=ref.child("board/"+tg+"/likes/"+group);
    lk.once("value",function(v){ v.val()?lk.remove():lk.set(true); }); return;
  }
  if(a==="comment"){
    var cg=+b.getAttribute("data-g"), inp=document.getElementById("cm-"+cg), msg=document.getElementById("cmm-"+cg);
    var txt=inp?inp.value.trim():"";
    if(!isMeaningful(txt,5)){ if(msg) msg.textContent="조금 더 구체적으로 남겨 주세요."; return; }
    if(!ref){ if(msg) msg.textContent="실시간 연결이 있어야 댓글을 남길 수 있어요."; return; }
    ref.child("board/"+cg+"/comments").push({from:group,text:txt,at:Date.now()}); inp.value=""; if(msg) msg.textContent=""; return;
  }
  /* 교사 */
  if(a==="next"){ setPhase(phase+1); return; }
  if(a==="prev"){ setPhase(phase-1); return; }
  if(a==="tplay"){ timer.running?tPause():tStart(); return; }
  if(a==="treset"){ tReset(); return; }
  if(a==="tplus"){ tAdjust(10); return; }
  if(a==="tminus"){ tAdjust(-10); return; }
  if(a==="reset"){
    if(!armed){ armed=true; b.textContent="한 번 더 누르면 모든 모둠 기록이 지워져요"; setTimeout(function(){armed=false;if(b.isConnected)b.textContent="새 수업으로 초기화";},3000); return; }
    armed=false; phase=0; groupsData={}; timer={duration:C.timerDefault,remaining:C.timerDefault,running:false,endsAt:0};
    boardData={}; if(ref) ref.set({phase:0,timer:timer,groups:null,board:null});
    saveLocal(); render(); return;
  }
});

/* 주소 뒤 #teacher, #group-1 로 바로 들어가기 */
var hm=(location.hash||"").match(/^#(teacher|group-(\d+))$/);
if(hm){ role=hm[1]==="teacher"?"teacher":"group"; group=hm[2]?+hm[2]:null; loadLocal(); initLive(); }
render();
})();
</script>
</body>
</html>
